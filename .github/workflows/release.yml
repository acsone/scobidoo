on:
  push:
    branches:
      - 16.0

name: release

jobs:
  pypi:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      # Used to authenticate to PyPI via OIDC.
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: build
      run: cd statechart ; pipx run build -o ../dist

    - name: publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

